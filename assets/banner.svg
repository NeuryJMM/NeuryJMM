<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="Consolas,'Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.grid{animation:gp 5s ease-in-out infinite}
@keyframes gp{0%,100%{opacity:.45}50%{opacity:1}}
.scan{animation:sc 6s linear infinite}
@keyframes sc{0%{transform:translateX(-300px)}100%{transform:translateX(1500px)}}
.title{animation:tt 4s ease-in-out infinite}
@keyframes tt{0%,100%{opacity:.85}50%{opacity:1}}
.w{fill:#a89cc0;animation:wh 7.2s infinite}
@keyframes wh{0%{fill:#f472b6}16%{fill:#f472b6}17%,100%{fill:#a89cc0}}
.wave{stroke-dasharray:1400;stroke-dashoffset:1400;animation:dr 6s ease-in-out infinite}
@keyframes dr{0%{stroke-dashoffset:1400}60%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:-1400}}
.dot{animation:dt 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dt{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(2);opacity:1}}
</style>
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a1a4a" stroke-width="1"/></pattern>
<linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/><stop offset=".45" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#c084fc" stop-opacity="0"/><stop offset=".5" stop-color="#c084fc" stop-opacity=".35"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="340" fill="#0a0614"/>
<rect class="grid" width="1200" height="340" fill="url(#g)"/>
<rect width="1200" height="340" fill="url(#glow)"/>
<rect class="scan" x="0" y="0" width="300" height="340" fill="url(#sg)"/>
<text class="title" x="600" y="150" text-anchor="middle" font-size="62" font-weight="bold" fill="#f3e8ff" letter-spacing="4">NEURY MONTERO</text>
<text x="600" y="205" text-anchor="middle" font-size="22" font-weight="bold" fill="#c084fc" letter-spacing="2">CYBERSECURITY  •  INFRASTRUCTURE  •  NETWORK SECURITY</text>
<text x="600" y="248" text-anchor="middle" font-size="18" letter-spacing="2"><tspan class="w" style="animation-delay:0.0s">BUILD</tspan><tspan fill="#6b5a8a">  →  </tspan><tspan class="w" style="animation-delay:1.2s">SECURE</tspan><tspan fill="#6b5a8a">  →  </tspan><tspan class="w" style="animation-delay:2.4s">TEST</tspan><tspan fill="#6b5a8a">  →  </tspan><tspan class="w" style="animation-delay:3.5999999999999996s">DETECT</tspan><tspan fill="#6b5a8a">  →  </tspan><tspan class="w" style="animation-delay:4.8s">REMEDIATE</tspan><tspan fill="#6b5a8a">  →  </tspan><tspan class="w" style="animation-delay:6.0s">AUTOMATE</tspan></text>
<polyline class="wave" points="20,305 100,298 180,303 260,292 340,299 420,306 500,300 580,296 660,304 740,293 820,296 900,306 980,300 1060,292 1140,298 1180,296" fill="none" stroke="#f472b6" stroke-width="2"/>
<g fill="#c084fc"><circle class="dot" style="animation-delay:0.0s" cx="100" cy="298" r="3"/><circle class="dot" style="animation-delay:0.3s" cx="260" cy="292" r="3"/><circle class="dot" style="animation-delay:0.6s" cx="420" cy="306" r="3"/><circle class="dot" style="animation-delay:0.8999999999999999s" cx="580" cy="296" r="3"/><circle class="dot" style="animation-delay:1.2s" cx="740" cy="293" r="3"/><circle class="dot" style="animation-delay:1.5s" cx="900" cy="306" r="3"/><circle class="dot" style="animation-delay:1.7999999999999998s" cx="1060" cy="292" r="3"/></g></svg>